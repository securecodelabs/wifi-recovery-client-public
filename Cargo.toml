[package]
name = "wifi-recovery-client"
version = "0.1.1"
edition = "2024"
rust-version = "1.93"
license = "Apache-2.0"
publish = false
description = "Command-line client for the WiFi recovery job API"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
hex = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["json", "multipart", "stream", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "signal", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
cognitive_complexity = "deny"
too_many_lines = "deny"
excessive_nesting = "deny"
too_many_arguments = "deny"

[profile.release]
lto = "thin"
strip = true
